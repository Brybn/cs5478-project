[project]
name = "adaptive-action-chunking"
version = "0.1.0"
description = "When to replan: event-triggered action chunking for diffusion policies in ManiSkill"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "diffusers>=0.40.0",
    "gymnasium>=1.3.0",
    "h5py>=3.16.0",
    "mani-skill==3.0.1",
    "numpy==2.2.6",
    "torch==2.11.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
